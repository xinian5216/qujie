        ["04","Relay hostnames","If ANTHROPIC_BASE_URL lands on .cn, Aliyun / Tencent Cloud or a Chinese-lab domain, it is treated as a relay."]
      ],
      faq:[
        ["Is this Anthropic’s real decision?","No. The region layer uses the public supported list; local fingerprints follow public reverse-engineering. Real enforcement also uses payments, phone numbers and account behavior."],
        ["Why is timezone more important than IP?","A VPN only changes the exit IP. Claude Code reads the OS timezone. Asia/Shanghai or Asia/Urumqi is the native signal."],
        ["Why is Hong Kong blocked too?","Hong Kong and Macau are not on the list. Hong Kong cloud ASN exits often get 302. Taiwan is listed as supported."],
        ["Do you upload my fingerprints?","The ten local fingerprints stay in the browser. Exit-IP lookup sends the current request address to a geolocation API — required for the region check."],
        ["Does a low score mean Claude will work?","No. Low score only means the browser-side China portrait is weak. Account locale, payment rails and relay hostnames can still trigger limits."]
      ]
    }
  };
  const verdictCopy = {
    idle: { zh:"待检测", en:"Ready", hintZh:"尚未扫描", hintEn:"Not scanned yet" },
    "china-block": { zh:"中国相关地区 · 官方不可用", en:"China-related · officially unavailable", hintZh:"出口落在中国大陆 / 香港 / 澳门。Claude.ai 会在地区层直接拒绝。", hintEn:"Exit is CN / HK / MO. Claude.ai rejects at the region layer." },
    blocked: { zh:"不支持地区", en:"Unsupported region", hintZh:"出口国家不在 Anthropic 官方支持名单内。", hintEn:"Exit country is not on Anthropic’s supported list." },
    high: { zh:"出口可用 · 中国用户高风险", en:"Region ok · high China-user risk", hintZh:"IP 在支持地区，但本机时区 / 语言等画像很像中国用户。Claude Code 仍可能标记。", hintEn:"IP is in a supported region, but the local portrait looks strongly Chinese. Claude Code may still flag it." },
    medium: { zh:"出口可用 · 中等指纹风险", en:"Region ok · medium fingerprint risk", hintZh:"地区层会放行，但仍有若干中国相关信号。", hintEn:"Region layer would allow you, but some China-related signals remain." },
    low: { zh:"低风险", en:"Low risk", hintZh:"出口在支持地区，本机中国用户指纹较弱。", hintEn:"Exit is supported and local China-user fingerprints are weak." }
  };

  let lang = "zh";
  let phase = "idle";
  let last = { fp: null, geo: null };

  try { const s = localStorage.getItem("qujie-lang"); if (s === "en" || s === "zh") lang = s; } catch {}

  function $(id) { return document.getElementById(id); }
  function countryLabel(iso) {
    if (!iso) return lang === "zh" ? "未知" : "Unknown";
    const rec = COUNTRIES.find((c) => c[0] === iso);
    return rec ? (lang === "zh" ? rec[1] : rec[2]) : iso;
  }
  function setLang(next) {
    lang = next;
    try { localStorage.setItem("qujie-lang", next); } catch {}
    $("btn-zh").classList.toggle("on", lang === "zh");
    $("btn-en").classList.toggle("on", lang === "en");
    const c = copy[lang];
    $("brand").textContent = c.brand;
    $("tag").textContent = c.tag;
    $("hero").textContent = c.hero;
    $("sub").textContent = c.sub;
    $("stay").textContent = c.stay;
    $("local-label").textContent = c.local;
    $("exit-label").textContent = c.exit;
    $("method-title").textContent = c.method;
    $("proxy-title").textContent = c.proxy;
    $("proxy-hint").textContent = c.proxyHint;
    $("proxy-go").textContent = c.proxyGo;
    $("country-title").textContent = c.countries;
    $("faq-title").textContent = c.faq;
    $("disc").innerHTML = c.disc.replace("github.com/xinian5216/qujie", '<a href="https://github.com/xinian5216/qujie">github.com/xinian5216/qujie</a>');
    $("scan").textContent = phase === "running" ? c.scanning : phase === "done" ? c.rescan : c.scan;
    $("method").innerHTML = c.methods.map(([n,t,b]) => `<div class="tile"><div class="n">${n}</div><h3>${t}</h3><p class="muted" style="margin:0">${b}</p></div>`).join("");
    $("faq").innerHTML = c.faq.map(([q,a],i) => `<button type="button" data-i="${i}" class="${i===0?"open":""}"><strong>${q}</strong><div class="a">${a}</div></button>`).join("");
    if (phase === "idle") $("geo-idle").textContent = c.idleHint;
    renderState();
    renderCountries($("cq").value);
  }
  $("btn-zh").onclick = () => setLang("zh");
  $("btn-en").onclick = () => setLang("en");
  $("faq").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    $("faq").querySelectorAll("button").forEach((x) => x.classList.toggle("open", x === b && !x.classList.contains("open") ? true : x === b ? !x.classList.contains("open") : false));
    const open = b.classList.contains("open");
    $("faq").querySelectorAll("button").forEach((x) => x.classList.remove("open"));
    if (open) b.classList.add("open");
  });

  function fontAvailable(font) {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    if (!ctx) return false;
    const sample = "汉字检测MmWw@#";
    return ["monospace","serif","sans-serif"].filter((base) => {
      ctx.font = `16px ${base}`;
      const a = ctx.measureText(sample).width;
      ctx.font = `16px "${font}", ${base}`;
      return a !== ctx.measureText(sample).width;
    }).length >= 2;
  }
  function isPrivate(ip) {
    const [a,b] = ip.split(".").map(Number);
    return a===10||a===127||(a===192&&b===168)||(a===172&&b>=16&&b<=31)||(a===169&&b===254);
  }
  function probeWebRtc(timeoutMs = 2800) {
    return new Promise((resolve) => {
      const localIps = [], publicIps = [];
      if (typeof RTCPeerConnection === "undefined") return resolve({ localIps, publicIps });
      let settled = false, pc = null;
      const finish = () => {
        if (settled) return;
        settled = true;
        try { pc && pc.close(); } catch {}
        resolve({ localIps: [...new Set(localIps)], publicIps: [...new Set(publicIps)] });
      };
      const timer = setTimeout(finish, timeoutMs);
      try {
        pc = new RTCPeerConnection({ iceServers: [{ urls: ["stun:stun.l.google.com:19302"] }] });
        pc.createDataChannel("q");
        pc.onicecandidate = (ev) => {
          if (!ev.candidate) { clearTimeout(timer); finish(); return; }
          const m = /([0-9]{1,3}(?:\.[0-9]{1,3}){3})/.exec(ev.candidate.candidate);
          if (!m) return;
          const ip = m[1];
          if (isPrivate(ip)) localIps.push(ip);
          else if (Number(ip.split(".")[0]) < 224) publicIps.push(ip);
        };
        pc.createOffer().then((o) => pc && pc.setLocalDescription(o));
      } catch { clearTimeout(timer); resolve({ localIps, publicIps }); }
    });
  }
  async function lookupGeo() {
    try {
      const res = await fetch("https://ipwho.is/");
      const data = await res.json();
      if (data.success !== false && data.country_code) {
        const org = data.connection?.org || null;
        const iso = String(data.country_code).toUpperCase();
        return {
          ip: data.ip || "unknown", iso, country: data.country || null,
          city: [data.city, data.region].filter(Boolean).join(" / ") || "—",
          asn: data.connection?.asn != null ? "AS" + data.connection.asn : null,
          org, source: "ipwho.is",
          isHosting: HOSTING.some((k) => (org||"").toLowerCase().includes(k)),
          isChineseCloud: CN_CLOUD.some((k) => (org||"").toLowerCase().includes(k)),
        };
      }
    } catch {}
    try {
      const res = await fetch("https://get.geojs.io/v1/ip/geo.json");
      const data = await res.json();
      if (data.country_code) {
        const org = data.organization_name || data.organization || null;
        const iso = String(data.country_code).toUpperCase();
        return {
          ip: data.ip || "unknown", iso, country: data.country || null,
          city: [data.city, data.region].filter(Boolean).join(" / ") || "—",
          asn: data.asn ? "AS" + data.asn : null, org, source: "geojs",
          isHosting: HOSTING.some((k) => (org||"").toLowerCase().includes(k)),
          isChineseCloud: CN_CLOUD.some((k) => (org||"").toLowerCase().includes(k)),
        };
      }
    } catch {}
    return null;
  }
  function collect(rtc) {
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "unknown";
    const langs = navigator.languages?.length ? [...navigator.languages] : [navigator.language];
    const locale = Intl.DateTimeFormat().resolvedOptions().locale || navigator.language || "";
    const offset = new Date().getTimezoneOffset();
    const ua = navigator.userAgent;
    const first = (langs[0] || "").toLowerCase();
    let langS = 0, langD = first;
    if (["zh-cn","zh-hans","zh"].includes(first) || first.startsWith("zh-hans")) { langS = 1; langD = first; }
    else if (first.startsWith("zh-hk") || first === "zh-mo") langS = 0.7;
    else if (first.startsWith("zh")) langS = 0.4;
    const tzS = CHINA_TZ.has(tz) ? 1 : tz === "Asia/Hong_Kong" || tz === "Asia/Macau" || tz === "Asia/Macao" ? 0.85 : tz === "Asia/Taipei" ? 0.15 : 0;
    const loc = locale.toLowerCase();
    const locS = loc === "zh-cn" || loc === "zh-hans" || loc === "zh-hans-cn" ? 1 : loc.startsWith("zh-hk") || loc === "zh-mo" ? 0.75 : loc.startsWith("zh") ? 0.35 : 0;
    const offS = offset === -480 ? 0.7 : offset === -360 ? 0.45 : 0;
    const cjk = CJK.filter(fontAvailable);
    const vendor = VENDOR.filter(fontAvailable);
    let br = { s: 0, n: ua.slice(0, 40) };
    for (const [re, name] of CN_BROWSERS) if (re.test(ua)) { br = { s: 1, n: name }; break; }
    const hay = ua;
    const devHit = CN_DEVICES.find((d) => hay.toLowerCase().includes(d.toLowerCase()));
    const emo = /HarmonyOS|HUAWEI|HONOR|Xiaomi|Redmi|OPPO|vivo|Miui/i.test(ua) ? 0.8 : 0;
    let rtcS = 0, rtcD = "no candidates";
    if (rtc.publicIps.length) { rtcS = 0.85; rtcD = "public " + rtc.publicIps.join(", "); }
    else if (rtc.localIps.length) { rtcS = 0.4; rtcD = "local " + rtc.localIps.join(", "); }
    const hits = [
      { w:24, s:tzS, zh:"系统时区", en:"System timezone", v:tz },
      { w:18, s:langS, zh:"浏览器语言", en:"Browser languages", v:langs.slice(0,4).join(", ") || "n/a" },
      { w:14, s:Math.min(1, cjk.length/3), zh:"中文字体", en:"CJK fonts", v:cjk.length ? cjk.slice(0,4).join(", ") : "none" },
      { w:10, s:vendor.length?1:0, zh:"国产厂商字体", en:"OEM Chinese fonts", v:vendor.length ? vendor.join(", ") : "none" },
      { w:10, s:rtcS, zh:"WebRTC IP 泄露", en:"WebRTC IP leak", v:rtcD },
      { w:8, s:br.s, zh:"国产浏览器 / WebView", en:"Chinese browser / WebView", v:br.n },
      { w:6, s:devHit?1:0, zh:"国产品牌设备", en:"Chinese OEM device", v:devHit || "generic" },
      { w:4, s:locS, zh:"Intl 区域", en:"Intl locale", v:locale || "n/a" },
      { w:3, s:offS, zh:"时区偏移", en:"UTC offset", v:"UTC" + (-offset/60 >= 0 ? "+" : "") + (-offset/60) },
      { w:3, s:emo, zh:"系统厂商风格", en:"OS vendor style", v:emo ? "OEM / Harmony-like" : "other" },
    ];
    const score = Math.round(Math.min(100, Math.max(0, hits.reduce((n,h) => n + h.w * h.s, 0))));
    return { hits, score, tz };
  }
  function combine(geo, score) {
    if (!geo) return "idle";
    if (CHINA.has(geo.iso)) return "china-block";
    if (!SUPPORTED.has(geo.iso)) return "blocked";
    if (score >= 61) return "high";
    if (score >= 31) return "medium";
    return "low";
  }
  function setRing(score, verdict) {
    const circ = 2 * Math.PI * 70;
    $("arc").style.strokeDashoffset = String(circ * (1 - score/100));
    $("arc").setAttribute("stroke", verdict === "low" ? "#6a9e86" : verdict === "medium" ? "#c4a056" : verdict === "idle" ? "#1a1a1e" : "#c45c4a");
    $("score-text").textContent = String(score);
  }
  function renderState() {
    const c = copy[lang];
    const { fp, geo } = last;
    const score = fp?.score ?? 0;
    const v = phase === "idle" ? "idle" : combine(geo, score);
    const vc = verdictCopy[v];
    $("verdict").className = "verdict " + v;
    $("verdict").textContent = lang === "zh" ? vc.zh : vc.en;
    $("verdict-hint").textContent = lang === "zh" ? vc.hintZh : vc.hintEn;
    setRing(phase === "idle" ? 0 : score, v);
    $("signals").innerHTML = (fp?.hits || []).map((h) =>
      `<div class="sig"><div class="sig-name">${lang==="zh"?h.zh:h.en}</div><div class="sig-val">${h.v}</div><div class="bar"><i style="width:${Math.round(h.s*100)}%;background:${h.s>=0.7?"#c45c4a":h.s>=0.3?"#c4a056":"#6a9e86"}"></i></div></div>`
    ).join("");
    if (!geo) {
      $("geo-idle").hidden = false;
      $("geo-rows").hidden = true;
      $("geo-badge").hidden = true;
      $("geo-idle").textContent = phase === "running" ? (lang==="zh"?"正在解析出口节点…":"Resolving exit node…") : c.idleHint;
      return;
    }
    $("geo-idle").hidden = true;
    $("geo-rows").hidden = false;
    const ok = SUPPORTED.has(geo.iso);
    $("geo-badge").hidden = false;
    $("geo-badge").className = "badge " + (ok ? "ok" : "bad");
    $("geo-badge").textContent = ok ? c.supported : c.unsupported;
    const net = geo.isChineseCloud ? (lang==="zh"?"中国运营商 / 云":"Chinese ISP / cloud") : geo.isHosting ? (lang==="zh"?"机房 / 托管":"Hosting / datacenter") : (lang==="zh"?"未检出托管特征":"No hosting signature");
    const rows = [
      ["IP", geo.ip, false],
      [lang==="zh"?"国家 / 地区":"Country", `${countryLabel(geo.iso)} · ${geo.iso}`, !ok],
      [lang==="zh"?"城市":"City", geo.city || "—", false],
      ["ASN / Org", [geo.asn, geo.org].filter(Boolean).join(" · ") || "—", geo.isChineseCloud],
      [lang==="zh"?"网络类型":"Network", net, geo.isHosting || geo.isChineseCloud],
      [lang==="zh"?"数据源":"Source", geo.source, false],
    ];
    $("geo-rows").innerHTML = rows.map(([k,v,w]) => `<div class="row${w?" warn":""}"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  }
  async function runScan() {
    if (phase === "running") return;
    phase = "running";
    last = { fp: null, geo: null };
    $("scan").disabled = true;
    $("scan").textContent = copy[lang].scanning;
    renderState();
    const rtc = await probeWebRtc();
    const [fp, geo] = await Promise.all([Promise.resolve(collect(rtc)), lookupGeo()]);
    last = { fp, geo };
    phase = "done";
    $("scan").disabled = false;
    $("scan").textContent = copy[lang].rescan;
    renderState();
  }
  $("scan").onclick = () => runScan();
  $("proxy-go").onclick = () => {
    const raw = $("host").value.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/\/.*$/,"").replace(/:\d+$/,"");
    if (!raw) { $("proxy-out").textContent = ""; return; }
    const labHits = LAB.filter((k) => raw.includes(k));
    const domainHits = [...INFRA, ...RESELLER].filter((k) => raw.includes(k) || (k === ".cn" && (raw.endsWith(".cn") || raw.includes(".com.cn"))));
    const kind = labHits.length && domainHits.length ? "both" : labHits.length ? "lab" : domainHits.length ? "domain" : "none";
    const msg = {
      none: lang==="zh" ? "未命中公开的中转 / 国产大模型关键词。" : "No public relay / Chinese-lab keywords.",
      domain: lang==="zh" ? "命中中国云 / 中转域名特征：" : "Matched Chinese-cloud / relay keywords: ",
      lab: lang==="zh" ? "命中国产大模型实验室关键词：" : "Matched Chinese AI-lab keywords: ",
      both: lang==="zh" ? "同时命中中转域名与国产实验室：" : "Matched both relay and Chinese-lab keywords: ",
    };
    $("proxy-out").textContent = msg[kind] + (kind==="none" ? "" : [...new Set([...labHits, ...domainHits])].join(", "));
  };
  function renderCountries(q) {
    const raw = q.trim();
    const lq = raw.toLowerCase();
    let list = COUNTRIES;
    if (lq) {
      const iso = ALIAS[lq] || ALIAS[raw] || (lq.length === 2 ? lq.toUpperCase() : null);
      list = COUNTRIES.filter((c) => c[0] === iso || c[0].toLowerCase().includes(lq) || c[1].includes(raw) || c[2].toLowerCase().includes(lq));
      if (!list.length) list = COUNTRIES.slice(0, 8);
    } else list = COUNTRIES.slice(0, 8);
    $("chits").innerHTML = list.slice(0, 8).map(([iso, zh, en]) => {
      const ok = SUPPORTED.has(iso);
      return `<div class="hit"><span>${lang==="zh"?zh:en} · ${iso}</span><span class="badge ${ok?"ok":"bad"}">${ok ? copy[lang].supported : copy[lang].unsupported}</span></div>`;
    }).join("");
  }
  $("cq").addEventListener("input", (e) => renderCountries(e.target.value));
  setLang(lang);
  setTimeout(() => runScan(), 280);
  </script>
</body>
